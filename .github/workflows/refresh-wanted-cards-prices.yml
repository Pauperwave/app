name: refresh-wanted-cards-prices

on:
  schedule:
    # Ogni lunedì alle 06:00 UTC — vedi discussione 2026-08-08,
    # docs/PROGRESS.md, sul refresh settimanale invece che live.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Refresh wanted-cards prices
        env:
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          NUXT_SUPABASE_SECRET_KEY: ${{ secrets.NUXT_SUPABASE_SECRET_KEY }}
          CARDTRADER_API_TOKEN: ${{ secrets.CARDTRADER_API_TOKEN }}
        run: node scripts/refresh-wanted-cards-prices.mjs
